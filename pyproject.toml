[project]
name = "jev-rubric-judge"
version = "0.1.0"
description = "Jev as a judge for yes/no rubric questions: answer the confident ones, send the rest to a human."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_rubric_judge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
